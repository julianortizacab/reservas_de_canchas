name: CI

on:
  push:
    branches:
      - development

permissions:
  contents: read

jobs:
  tests:
    name: Tests (domain coverage >= 90%)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests with domain coverage
        run: >-
          python -m pytest
          --cov=flaskr.domain
          --cov-report=term-missing
          --cov-fail-under=90

  pylint:
    name: Pylint (minimum 80%)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Pylint
        run: python -m pylint --fail-under=8.01 flaskr tests
